name: Engineering verification
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://rag:test@127.0.0.1:5432/rag?sslmode=disable
      INTERNAL_TOKEN: local-test-internal-token-123456789
      ADMIN_USER: admin
      ADMIN_PASSWORD: test-admin-password
      USER_NAME: demo
      USER_PASSWORD: test-user-password
      DEEPSEEK_BASE_URL: http://127.0.0.1:8100
      DASHSCOPE_BASE_URL: http://127.0.0.1:8100
      DEEPSEEK_API_KEY: contract-test
      DASHSCOPE_API_KEY: contract-test
      EMBEDDING_DIMENSION: "2"
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data
      - uses: actions/setup-go@v5
        with: {go-version: "1.27"}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.7", python-version: "3.12"}
      - run: go test ./... && go vet ./... && go build -o ../data/backend .
        working-directory: backend
      - run: uv sync --frozen --extra test --extra faithfulness && uv run pytest -q
        working-directory: rag
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Cross-service contracts on native PostgreSQL
        shell: bash
        run: |
          service_pids=()
          cleanup() {
            # 测试成功或失败都释放后台服务，避免收尾阶段仍有进程占用资源。
            for pid in "${service_pids[@]}"; do
              kill "$pid" 2>/dev/null || true
            done
            for pid in "${service_pids[@]}"; do
              wait "$pid" 2>/dev/null || true
            done
          }
          trap cleanup EXIT

          (cd rag && uv run python -m tests.legacy_seed)
          (cd backend && exec ../data/backend >../data/go-test.log 2>&1) &
          service_pids+=("$!")
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8080/health && break; sleep 1; done
          # uv sync 已创建虚拟环境；常驻服务直接启动，避免 uv run 长时间持有缓存锁。
          (cd rag && exec .venv/bin/python -m uvicorn tests.fake_models:app --host 127.0.0.1 --port 8100 >../data/model-test.log 2>&1) &
          service_pids+=("$!")
          (cd rag && exec .venv/bin/python -m helpdesk >../data/rag-test.log 2>&1) &
          service_pids+=("$!")
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/health && break; sleep 1; done
          cd rag
          uv run python -m tests.integration_check
          uv run python -m tests.evaluation_check
          uv run python -m tests.scope_integration_check
          uv run python -m tests.access_integration_check
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated container test configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          content = Path('.env.example').read_text()
          for placeholder in ('replace-with-a-long-random-string', 'replace-with-a-strong-password', 'replace-with-another-password'):
              content = content.replace(placeholder, secrets.token_hex(24))
          content = content.replace('POSTGRES_PASSWORD=rag', 'POSTGRES_PASSWORD=' + secrets.token_hex(24))
          Path('.env').write_text(content)
          PY
      - name: Validate and start cloud container entrypoint
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          docker compose exec -T backend wget -q -O /dev/null http://127.0.0.1:8080/health
          docker compose exec -T rag python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      - name: Stop isolated container test
        if: always()
        run: docker compose down --volumes
