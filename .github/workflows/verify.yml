name: Engineering verification
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HD_TEST_DATABASE_URL: postgresql://postgres:synthetic-test@127.0.0.1:5432/postgres
      NO_PROXY: 127.0.0.1,localhost
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: rewrite/frontend/package-lock.json}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.7", python-version: "3.12"}
      - run: uv sync --locked --project rewrite/backend
      - name: Python lint, types and PostgreSQL regression
        run: |
          rewrite/backend/.venv/bin/ruff check rewrite/backend/src rewrite/backend/tests tools/check_runtime.py --config rewrite/backend/pyproject.toml
          rewrite/backend/.venv/bin/mypy --config-file rewrite/backend/pyproject.toml rewrite/backend/src
          rewrite/backend/.venv/bin/python -m pytest rewrite/backend/tests -q --tb=short
      - name: Frontend contracts and build
        working-directory: rewrite/frontend
        run: npm ci && npm test && npm run build
      - name: Wheel isolation and frozen graph protocol
        run: |
          uv build --project rewrite/backend --out-dir data/python-wheel
          rewrite/backend/.venv/bin/python -I rewrite/scripts/verify_package.py data/python-wheel/*.whl
          rewrite/backend/.venv/bin/python rewrite/scripts/check_graph_protocol.py
      - name: Full browser flow with local model fixtures
        run: |
          cd rewrite/frontend
          npx playwright install --with-deps chromium
          cd ../..
          rewrite/backend/.venv/bin/python rewrite/scripts/verify_browser.py
      - name: Historical offline evaluation regression
        run: |
          uv sync --locked --project rag --extra test --extra faithfulness
          rag/.venv/bin/python -m pytest rag/tests -q
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic Python deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          Path('.env.python').write_text(Path('.env.example').read_text().replace('CHANGE_ME', secrets.token_hex(24)))
          PY
      - name: Build and explicitly initialize schema
        run: |
          docker compose --env-file .env.python -p helpdesk-ci config --quiet
          docker compose --env-file .env.python -p helpdesk-ci build api web
          docker compose --env-file .env.python -p helpdesk-ci up -d --wait db
          docker compose --env-file .env.python -p helpdesk-ci run --rm --no-deps api python -m helpdesk.entrypoints.migrate --directory /workspace/rewrite/db/migrations
      - name: Start Python API, worker and web
        run: |
          docker compose --env-file .env.python -p helpdesk-ci up --no-build -d --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
      - name: Stop synthetic deployment
        if: always()
        run: docker compose --env-file .env.python -p helpdesk-ci down --volumes
