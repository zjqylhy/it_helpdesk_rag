[project]
name = "helpdesk-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.143,<0.144",
  "uvicorn>=0.36,<1",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "bcrypt>=4,<6",
  "python-multipart>=0.0.20,<1",
  "langgraph==1.2.10",
  "httpx>=0.28,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "jieba>=0.42.1,<1",
  "rank-bm25>=0.2.2,<1",
  "pgvector>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "httpx>=0.28,<1", "mypy>=1.18,<2", "ruff>=0.14,<1"]

[project.scripts]
helpdesk-api = "helpdesk.entrypoints.api:main"
helpdesk-migrate = "helpdesk.entrypoints.migrate:main"
helpdesk-admin = "helpdesk.entrypoints.admin:main"
helpdesk-map-files = "helpdesk.entrypoints.map_files:main"
helpdesk-worker = "helpdesk.entrypoints.worker:main"
helpdesk-eval = "helpdesk.entrypoints.evaluate:main"
helpdesk-rebind = "helpdesk.entrypoints.rebind:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
