const graphs=JSON.parse(document.getElementById('graphs').textContent);const nav=document.getElementById('nav'),canvas=document.getElementById('canvas');let current=graphs[0],scale=1,width=1;
for(const kind of ['current','target']){const heading=document.createElement('div');heading.className='group';heading.textContent=kind==='current'?'当前已有':'目标待实现';nav.append(heading);for(const g of graphs.filter(x=>x.kind===kind)){const b=document.createElement('button');b.textContent=g.title;b.dataset.id=g.id;b.onclick=()=>select(g);nav.append(b)}}
function resize(){const svg=canvas.querySelector('svg');svg.style.width=`${width*scale}px`;document.getElementById('zoom').textContent=`${Math.round(scale*100)}%`}
function fit(){scale=Math.min(1,Math.max(.2,(canvas.clientWidth-48)/width));resize()}
function select(g){current=g;canvas.innerHTML=g.svg;const svg=canvas.querySelector('svg');width=svg.viewBox.baseVal.width;document.getElementById('title').textContent=g.title;const status=document.getElementById('status');status.textContent=g.kind==='current'?'已有实现':'待实现设计';status.className='badge '+g.kind;document.getElementById('source').href=g.id+'.mmd';document.getElementById('svg').href=g.id+'.svg';for(const b of nav.querySelectorAll('button'))b.classList.toggle('active',b.dataset.id===g.id);canvas.scrollTo(0,0);fit();history.replaceState(null,'','#'+g.id)}
document.getElementById('plus').onclick=()=>{scale=Math.min(2,scale+.15);resize()};document.getElementById('minus').onclick=()=>{scale=Math.max(.2,scale-.15);resize()};document.getElementById('fit').onclick=fit;document.getElementById('actual').onclick=()=>{scale=1;resize()};select(graphs.find(g=>g.id===location.hash.slice(1))||graphs[0]);
</script></body></html>
