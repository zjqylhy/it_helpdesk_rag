services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置 POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD}@db:5432/rag?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      RAG_URL: http://rag:8000
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  rag:
    build: {context: ., dockerfile: rag/Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD}@db:5432/rag?sslmode=disable
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-${QWEN_API_KEY:-}}
    volumes: ["uploads:/data/uploads:ro"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 20
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      backend: {condition: service_healthy}
      rag: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres:
  uploads:
