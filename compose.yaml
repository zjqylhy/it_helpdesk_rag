# 统一 Python 应用；使用 --env-file .env.python，卷与原应用隔离。
x-python-environment: &python-environment
  HD_DATABASE_URL: postgresql://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:?请配置 POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-helpdesk}
  HD_UPLOAD_DIR: /data/uploads
  HD_MODEL_INFERENCE_ENABLED: ${HD_MODEL_INFERENCE_ENABLED:-false}
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55534}:5432"]
    volumes: ["python_database:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: helpdesk-python:${APP_REVISION:-local}
    build:
      context: .
      dockerfile: rewrite/deploy/Dockerfile
      target: runtime
      args:
        APP_REVISION: ${APP_REVISION:-local}
    restart: unless-stopped
    env_file: .env.python
    environment:
      <<: *python-environment
      HD_HOST: 0.0.0.0
      HD_PORT: 18080
    volumes:
      - python_files:/data/uploads
      - ./deploy/certs:/run/certs:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    image: helpdesk-python:${APP_REVISION:-local}
    command: [python, -m, helpdesk.entrypoints.worker]
    restart: unless-stopped
    env_file: .env.python
    environment: *python-environment
    volumes:
      - python_files:/data/uploads:ro
      - ./deploy/certs:/run/certs:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: rewrite/deploy/Dockerfile
      target: web
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-3000}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  python_database:
  python_files:
